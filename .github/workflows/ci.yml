name: CI

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-platform:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: checks-${{ matrix.runner }}
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration

  test:
    if: always()
    needs: test-platform
    runs-on: ubuntu-24.04
    steps:
      - name: Require every platform to pass
        env:
          PLATFORM_RESULT: ${{ needs.test-platform.result }}
        run: test "$PLATFORM_RESULT" = success
